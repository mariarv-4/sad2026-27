[sssd]
services = nss, pam, ssh
domains = mrv.internal

[domain/mrv.internal]
# Dónde están los usuarios (id) y quién comprueba las contraseñas (auth, chpass)
id_provider = ldap
auth_provider = ldap
chpass_provider = ldap
ldap_uri = ldap://172.3.7.2
ldap_search_base = dc=mrv,dc=internal

# Siempre cifrado (StartTLS) y comprobando el certificado del idp con la CA de la empresa
ldap_id_use_start_tls = true
ldap_tls_reqcert = demand
ldap_tls_cacert = /etc/ssl/certs/ca-certificates.crt

# Autorización: quién puede iniciar sesión en ESTA máquina
access_provider = simple
simple_allow_groups = admins

# Permite iniciar sesión aunque el idp no responda (con las credenciales de la última vez)
cache_credentials = true