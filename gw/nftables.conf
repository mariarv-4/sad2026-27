#!/usr/sbin/nft -f
# Cortafuegos de la empresa (Práctica 4)

flush ruleset

# Redes y máquinas: las genera gw/provision.sh a partir de la N del Vagrantfile
include "/etc/nftables-red.nft"

define IF_NAT   = "eth0" # Salida real a Internet (NAT de Vagrant)
define IF_WAN   = "eth1" # Internet simulado (red_wan, donde está externo)
define IF_DMZ   = "eth2" 
define IF_LAN   = "eth3"
define IF_GES   = "eth4"

# tabla equivalente a nat de iptables
table ip traduccion {
    chain post {
        type nat hook postrouting priority srcnat; policy accept;
        # R1: Las redes internas salen a internet con la IP del gw
        oifname {$IF_NAT,$IF_WAN} masquerade
    }


}


